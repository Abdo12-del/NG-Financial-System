<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0080FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Document Card Outline -->
  <g filter="url(#dropGlow)">
    <path d="M 190 70 
             L 320 70 
             C 325 70, 335 78, 345 88 
             L 370 115 
             C 376 122, 380 130, 380 140 
             L 380 230 
             C 380 250, 365 265, 345 265 
             L 175 265 
             C 155 265, 140 250, 140 230 
             L 140 120 
             C 140 92, 162 70, 190 70 Z" 
          fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Folded Ear -->
    <path d="M 320 70 L 320 120 C 320 130, 330 140, 340 140 L 380 140" 
          fill="none" stroke="url(#blueGrad)" stroke-width="18" stroke-linejoin="round"/>

    <!-- Bar Chart Columns Inside Document -->
    <rect x="235" y="195" width="22" height="45" rx="10" fill="url(#blueGrad)"/>
    <rect x="275" y="170" width="22" height="70" rx="10" fill="url(#blueGrad)"/>
    <rect x="315" y="140" width="22" height="100" rx="10" fill="url(#blueGrad)"/>

    <!-- Upward Trending Dynamic Arrow -->
    <path d="M 210 240 Q 280 230 360 170" 
          fill="none" stroke="#0077FF" stroke-width="20" stroke-linecap="round"/>
    <polygon points="345,150 380,165 365,198" fill="#0077FF"/>
  </g>

  <!-- Circular Coin with DZD -->
  <g transform="translate(195, 240)">
    <circle cx="0" cy="0" r="52" fill="white" filter="url(#dropGlow)"/>
    <circle cx="0" cy="0" r="48" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="41" fill="none" stroke="white" stroke-width="4" stroke-dasharray="6,4" opacity="0.7"/>
    <circle cx="0" cy="0" r="34" fill="url(#blueGrad)"/>
    <text x="0" y="8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="white" text-anchor="middle" letter-spacing="1">DZD</text>
  </g>

  <!-- Typography -->
  <text x="250" y="360" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="900">
    <tspan fill="#00A2FF">NG </tspan>
    <tspan fill="#0B2B68">Financial</tspan>
  </text>
  <text x="250" y="405" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#00A2FF" letter-spacing="4">
    System
  </text>

  <!-- Decorative Dividers -->
  <line x1="80" y1="395" x2="160" y2="395" stroke="#00A2FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="395" x2="420" y2="395" stroke="#00A2FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Slogan in Arabic -->
  <text x="250" y="450" text-anchor="middle" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="19" font-weight="600" fill="#2E4A7D">
    إدارة مالية ذكية ... لمستقبل أفضل
  </text>
</svg>
